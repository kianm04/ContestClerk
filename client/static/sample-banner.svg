<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="Sample banner">
  <!--
    The banner a conference shows while it has none of its own, 16:6 like a
    real one. Pale diagonal stripes and a label that says what it is, so that
    nobody takes it for a photograph of the conference. The label is narrow
    enough to show whole in the square-ish thumbnails of the first step, which
    crop the middle 620 of these 1600. The colours are the creation steps'
    field grey, input border and ink (layout.css).
  -->
  <defs>
    <pattern id="stripes" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="48" fill="#e9eef5"/>
    </pattern>
  </defs>
  <rect width="1600" height="600" fill="#f4f6fa"/>
  <rect width="1600" height="600" fill="url(#stripes)"/>
  <rect x="516" y="216" width="568" height="168" rx="16" fill="#ffffff" stroke="#dbe2ef" stroke-width="2"/>
  <g transform="translate(556 246) scale(4.5)" fill="none" stroke="#7c8cb5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <circle cx="9" cy="9" r="2"/>
    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
  </g>
  <text x="692" y="319" font-family="Inter, 'Inter Variable', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="600" fill="#0a0f38">Sample banner</text>
</svg>
